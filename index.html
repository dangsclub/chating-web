<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모바일 대화방</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f3f5}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:grid;grid-template-rows:minmax(0,1fr) 70px;overflow:hidden}
#messages{min-height:0;overflow-y:auto;overflow-x:hidden;padding:28px 9px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;color:#999;font-size:13px;text-align:center}
.msg{max-width:82%;padding:6px 8px;border-radius:12px;line-height:1.25;word-break:break-word;white-space:pre-wrap}
.sent{align-self:flex-end;background:#008cba;color:#fff;border-bottom-right-radius:3px}
.received{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:3px}
.time{display:block;margin-top:1px;font-size:9px;opacity:.7;text-align:right}
#form{height:70px;display:flex;align-items:flex-start;gap:6px;padding:8px 7px 16px;background:#fff;border-top:1px solid #ddd}
#input{flex:1;min-width:0;height:34px;border:1px solid #ddd;border-radius:17px;padding:0 11px;font-size:14px;outline:none}
#input:focus{border-color:#008cba}
#send{flex:0 0 auto;height:34px;border:0;border-radius:17px;padding:0 12px;background:#008cba;color:#fff;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="app">
<main id="messages"></main>
<form id="form">
<input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
<button id="send" type="submit">보내기</button>
</form>
</div>

<!--
  다음 단계에서 Firebase 설정값만 넣으면 실시간 채팅이 활성화됩니다.
  현재는 서버 설정이 없으므로 localStorage 모드로 동작합니다.
-->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue,
  query,
  orderByChild,
  limitToLast
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";

const firebaseConfig = {
  // Firebase 콘솔에서 발급받은 값을 여기에 넣습니다.
  // apiKey: "...",
  // authDomain: "...",
  // databaseURL: "...",
  // projectId: "...",
  // storageBucket: "...",
  // messagingSenderId: "...",
  // appId: "..."
};

const params=new URLSearchParams(location.search);
const roomId=(params.get("room")||"default").trim()||"default";
const KEY="messages:"+roomId;

const messagesEl=document.getElementById("messages");
const input=document.getElementById("input");
const form=document.getElementById("form");

let messages=[];
let realtimeReady=false;
let database=null;

function time(v){
  return new Date(v).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
}

function render(){
  messagesEl.replaceChildren();

  if(!messages.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent=realtimeReady
      ? "대화방 "+roomId+" · 아직 메시지가 없습니다."
      : "대화방 "+roomId+" · 실시간 서버 설정을 기다리는 중";
    messagesEl.appendChild(e);
    return;
  }

  for(const m of messages){
    const box=document.createElement("div");
    box.className="msg "+(m.type==="sent"?"sent":"received");
    box.textContent=m.text;

    const t=document.createElement("span");
    t.className="time";
    t.textContent=time(m.timestamp);
    box.appendChild(t);

    messagesEl.appendChild(box);
  }

  requestAnimationFrame(()=>messagesEl.scrollTop=messagesEl.scrollHeight);
}

function loadLocal(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||"[]");
    if(Array.isArray(saved))messages=saved;
  }catch(e){
    messages=[];
  }
  render();
}

async function sendMessage(text){
  if(!text)return;

  if(!realtimeReady){
    messages.push({
      text,
      type:"sent",
      timestamp:Date.now(),
      room:roomId
    });
    localStorage.setItem(KEY,JSON.stringify(messages));
    render();
    return;
  }

  await push(ref(database,"rooms/"+encodeURIComponent(roomId)+"/messages"),{
    text,
    timestamp:Date.now()
  });
}

function startRealtime(){
  if(!firebaseConfig.apiKey || !firebaseConfig.databaseURL){
    loadLocal();
    return;
  }

  try{
    const app=initializeApp(firebaseConfig);
    database=getDatabase(app);
    realtimeReady=true;

    const messagesRef=query(
      ref(database,"rooms/"+encodeURIComponent(roomId)+"/messages"),
      orderByChild("timestamp"),
      limitToLast(200)
    );

    onValue(messagesRef,(snapshot)=>{
      const data=snapshot.val()||{};
      messages=Object.values(data)
        .sort((a,b)=>(a.timestamp||0)-(b.timestamp||0))
        .map(m=>({
          text:String(m.text||""),
          type:"received",
          timestamp:Number(m.timestamp)||Date.now(),
          room:roomId
        }));

      render();
    });

    render();
  }catch(error){
    console.error("Firebase 초기화 실패:",error);
    realtimeReady=false;
    loadLocal();
  }
}

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const text=input.value.trim();
  if(!text)return;

  input.value="";

  try{
    await sendMessage(text);
  }catch(error){
    console.error("메시지 전송 실패:",error);
    input.value=text;
    alert("메시지를 보내지 못했습니다. Firebase 설정을 확인해주세요.");
  }

  input.focus();
});

startRealtime();
</script>
</body>
</html>
