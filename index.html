<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모바일 대화방</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f3f5}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:grid;grid-template-rows:minmax(0,1fr) 70px;overflow:hidden}
#messages{min-height:0;overflow-y:auto;overflow-x:hidden;padding:28px 9px 12px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;color:#999;font-size:13px;text-align:center}
.msg{max-width:82%;padding:6px 8px;border-radius:12px;line-height:1.25;word-break:break-word;white-space:pre-wrap}
.sent{align-self:flex-end;background:#008cba;color:#fff;border-bottom-right-radius:3px}
.received{align-self:flex-start;background:#fff;color:#333;border-bottom-left-radius:3px}
.time{display:block;margin-top:1px;font-size:9px;opacity:.7;text-align:right}
#form{height:70px;display:flex;align-items:flex-start;gap:6px;padding:8px 7px 16px;background:#fff;border-top:1px solid #ddd}
#input{flex:1;min-width:0;height:34px;border:1px solid #ddd;border-radius:17px;padding:0 11px;font-size:14px;outline:none}
#input:focus{border-color:#008cba}
#send{flex:0 0 auto;height:34px;border:0;border-radius:17px;padding:0 12px;background:#008cba;color:#fff;font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="app">
<main id="messages"></main>
<form id="form">
<input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
<button id="send" type="submit">보내기</button>
</form>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  onValue,
  query,
  orderByChild,
  limitToLast
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-database.js";
import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyChmbRsz03i6RUdTep5kSxfwBmBXkgmcuk",
  authDomain: "my-chay.firebaseapp.com",
  databaseURL: "https://my-chay-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-chay",
  storageBucket: "my-chay.firebasestorage.app",
  messagingSenderId: "39896419588",
  appId: "1:39896419588:web:af181789ef1164bae35451",
  measurementId: "G-YXJD0SK4Y1"
};

const params=new URLSearchParams(location.search);
const roomId=(params.get("room")||"default").trim()||"default";

const messagesEl=document.getElementById("messages");
const input=document.getElementById("input");
const form=document.getElementById("form");

let messages=[];
let realtimeReady=false;
let database=null;
let auth=null;
let currentUid=null;
let messagesUnsubscribe=null;

function time(v){
  return new Date(v).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
}

function render(){
  messagesEl.replaceChildren();

  if(!messages.length){
    const e=document.createElement("div");
    e.className="empty";
    e.textContent=realtimeReady
      ? "대화방 "+roomId+" · 아직 메시지가 없습니다."
      : "Firebase 연결 중...";
    messagesEl.appendChild(e);
    return;
  }

  for(const m of messages){
    const box=document.createElement("div");
    box.className="msg "+(m.uid===currentUid?"sent":"received");
    box.textContent=m.text;

    const t=document.createElement("span");
    t.className="time";
    t.textContent=time(m.timestamp);
    box.appendChild(t);

    messagesEl.appendChild(box);
  }

  requestAnimationFrame(()=>messagesEl.scrollTop=messagesEl.scrollHeight);
}

async function sendMessage(text){
  if(!realtimeReady || !currentUid){
    throw new Error("Firebase 인증이 완료되지 않았습니다.");
  }

  await push(ref(database,"rooms/"+encodeURIComponent(roomId)+"/messages"),{
    text,
    uid:currentUid,
    timestamp:Date.now()
  });
}

function subscribeMessages(){
  if(messagesUnsubscribe)messagesUnsubscribe();

  const messagesRef=query(
    ref(database,"rooms/"+encodeURIComponent(roomId)+"/messages"),
    orderByChild("timestamp"),
    limitToLast(200)
  );

  messagesUnsubscribe=onValue(messagesRef,(snapshot)=>{
    const data=snapshot.val()||{};
    messages=Object.values(data)
      .sort((a,b)=>(a.timestamp||0)-(b.timestamp||0))
      .map(m=>({
        text:String(m.text||""),
        uid:String(m.uid||""),
        timestamp:Number(m.timestamp)||Date.now()
      }));

    render();
  },(error)=>{
    console.error("Firebase 데이터 읽기 실패:",error);
    realtimeReady=false;
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="Firebase 데이터베이스 권한을 확인해주세요.";
    messagesEl.replaceChildren(e);
  });
}

async function startRealtime(){
  try{
    const app=initializeApp(firebaseConfig);
    database=getDatabase(app);
    auth=getAuth(app);

    onAuthStateChanged(auth,(user)=>{
      if(!user){
        currentUid=null;
        realtimeReady=false;
        return;
      }

      currentUid=user.uid;
      realtimeReady=true;
      subscribeMessages();
      render();
    });

    await signInAnonymously(auth);
  }catch(error){
    console.error("Firebase 초기화/인증 실패:",error);
    realtimeReady=false;
    const e=document.createElement("div");
    e.className="empty";
    e.textContent="Firebase 연결에 실패했습니다. 콘솔 설정을 확인해주세요.";
    messagesEl.replaceChildren(e);
  }
}

form.addEventListener("submit",async e=>{
  e.preventDefault();

  const text=input.value.trim();
  if(!text)return;

  input.value="";

  try{
    await sendMessage(text);
  }catch(error){
    console.error("메시지 전송 실패:",error);
    input.value=text;
    alert("메시지를 보내지 못했습니다. Firebase 인증/보안 규칙을 확인해주세요.");
  }

  input.focus();
});

startRealtime();
</script>
</body>
</html>
