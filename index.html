<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모바일 대화방</title>
<style>
:root{--header-h:30px;--input-h:50px;--blue:#008cba}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f1f3f5}
#app{position:fixed;inset:0;display:grid;grid-template-rows:var(--header-h) minmax(0,1fr) var(--input-h);overflow:hidden}
header{height:var(--header-h);background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;padding:0 6px}
#messages{min-height:0;overflow-y:auto;overflow-x:hidden;padding:6px 8px;display:flex;flex-direction:column;gap:6px;-webkit-overflow-scrolling:touch}
.empty{margin:auto;color:#999;font-size:14px}
.msg{max-width:82%;padding:8px 10px;border-radius:14px;line-height:1.35;word-break:break-word;white-space:pre-wrap}
.sent{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:4px}
.received{align-self:flex-start;background:#fff;border-bottom-left-radius:4px}
.time{display:block;margin-top:2px;font-size:10px;opacity:.7;text-align:right}
#form{min-height:0;height:var(--input-h);display:flex;align-items:center;gap:6px;padding:5px 7px;background:#fff;border-top:1px solid #ddd}
#input{flex:1;min-width:0;height:38px;border:1px solid #ddd;border-radius:19px;padding:0 12px;font-size:15px;outline:none}
#input:focus{border-color:var(--blue)}
#send{flex:0 0 auto;height:38px;border:0;border-radius:19px;padding:0 13px;background:var(--blue);color:#fff;font-size:14px;font-weight:700}
@media (max-height:520px){:root{--header-h:26px;--input-h:46px}header{font-size:13px}#messages{padding:4px 6px}#input,#send{height:34px}}
</style>
</head>
<body>
<div id="app">
<header>모바일 대화방</header>
<main id="messages"></main>
<form id="form">
<input id="input" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
<button id="send" type="submit">보내기</button>
</form>
</div>
<script>
const KEY="messages",messagesEl=document.getElementById("messages"),input=document.getElementById("input"),form=document.getElementById("form");
let messages=[];
try{const saved=JSON.parse(localStorage.getItem(KEY)||"[]");if(Array.isArray(saved))messages=saved}catch(e){}
function time(v){return new Date(v).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"})}
function render(){
messagesEl.replaceChildren();
if(!messages.length){const e=document.createElement("div");e.className="empty";e.textContent="아직 메시지가 없습니다.";messagesEl.appendChild(e);return}
for(const m of messages){const box=document.createElement("div");box.className="msg "+(m.type==="sent"?"sent":"received");box.textContent=m.text;const t=document.createElement("span");t.className="time";t.textContent=time(m.timestamp);box.appendChild(t);messagesEl.appendChild(box)}
requestAnimationFrame(()=>messagesEl.scrollTop=messagesEl.scrollHeight)
}
form.addEventListener("submit",e=>{e.preventDefault();const text=input.value.trim();if(!text)return;messages.push({text,type:"sent",timestamp:Date.now()});localStorage.setItem(KEY,JSON.stringify(messages));input.value="";render();input.focus()});
render();
</script>
</body>
</html>
