<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>모바일 대화방</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f1f3f5;
      color: #222;
    }

    .chat-container {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #f1f3f5;
      overflow: hidden;
    }

    .chat-header {
      flex: 0 0 auto;
      background: #008cba;
      color: white;
      font-size: 19px;
      font-weight: 700;
      text-align: center;
      padding: 14px 12px;
      padding-top: max(6px, env(safe-area-inset-top));
    }

    .chat-messages {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .empty-message {
      margin: auto;
      color: #999;
      font-size: 14px;
      text-align: center;
    }

    .message {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.45;
      word-break: break-word;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
    }

    .message.sent {
      align-self: flex-end;
      background: #008cba;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.received {
      align-self: flex-start;
      background: white;
      border-bottom-left-radius: 4px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .timestamp {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.7;
      text-align: right;
    }

    .chat-input {
      flex: 0 0 auto;
      display: flex;
      gap: 8px;
      padding: 7px 10px;
      padding-bottom: max(7px, env(safe-area-inset-bottom));
      background: white;
      border-top: 1px solid #ddd;
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      height: 36px;
      border: 1px solid #ddd;
      border-radius: 21px;
      padding: 0 13px;
      font-size: 15px;
      outline: none;
    }

    .chat-input input:focus {
      border-color: #008cba;
    }

    .chat-input button {
      flex: 0 0 auto;
      height: 36px;
      border: 0;
      border-radius: 18px;
      padding: 0 14px;
      background: #008cba;
      color: white;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .chat-input button:active {
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <header class="chat-header">모바일 대화방</header>

    <main class="chat-messages" id="chatMessages"></main>

    <form class="chat-input" id="chatForm">
      <input
        id="chatInput"
        type="text"
        placeholder="메시지를 입력하세요"
        autocomplete="off"
      >
      <button type="submit">보내기</button>
    </form>
  </div>

  <script>
    const STORAGE_KEY = "messages";

    let messages = [];
    try {
      messages = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      if (!Array.isArray(messages)) messages = [];
    } catch {
      messages = [];
    }

    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const chatForm = document.getElementById("chatForm");

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }

    function formatTime(timestamp) {
      return new Date(timestamp).toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderMessages() {
      chatMessages.innerHTML = "";

      if (messages.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = "아직 메시지가 없습니다.";
        chatMessages.appendChild(empty);
        return;
      }

      messages.forEach((message) => {
        const div = document.createElement("div");
        div.className = "message " + (message.type === "sent" ? "sent" : "received");

        const text = document.createElement("div");
        text.className = "message-text";
        text.textContent = message.text;

        const timestamp = document.createElement("span");
        timestamp.className = "timestamp";
        timestamp.textContent = formatTime(message.timestamp);

        div.appendChild(text);
        div.appendChild(timestamp);
        chatMessages.appendChild(div);
      });

      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;

      messages.push({
        text,
        type: "sent",
        timestamp: Date.now()
      });

      saveMessages();
      renderMessages();

      chatInput.value = "";
      chatInput.focus();
    }

    chatForm.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage();
    });

    renderMessages();
  </script>
</body>
</html>
